name: Build and deploy Node.js app to Azure Web App - sanctuary-portal

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Warn if package-lock missing (opsvantage-web)
        run: |
          if [ ! -f opsvantage-web/package-lock.json ]; then
            echo "::warning::opsvantage-web/package-lock.json is missing - CI will use npm install instead of npm ci"
          fi

      - name: Install dependencies (opsvantage-web)
        run: |
          if [ -f opsvantage-web/package-lock.json ]; then
            npm ci --prefix opsvantage-web
          else
            echo "package-lock.json not found in opsvantage-web, running npm install instead"
            npm install --prefix opsvantage-web
          fi

      - name: Build (opsvantage-web)
        run: npm run build --prefix opsvantage-web

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: opsvantage-web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # Azure login step removed; only Cloudflare deploy is needed

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: sanctuary-portal
          slot-name: 'Production'
          package: .
