name: Wallet CI
on:
	push:
		paths:
			- "wallet/**"
			- "components/wallet/**"
			- "lib/wallet/**"
jobs:
	wallet-build:
		name: Wallet build
		runs-on: ubuntu-latest
		steps:
			- name: Checkout
				uses: actions/checkout@v4
			- name: Setup Node
				uses: actions/setup-node@v4
				with:
					node-version: 20
					cache: npm
			- name: Install
				run: npm ci
			- name: Build
				run: npm run build
