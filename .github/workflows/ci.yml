name: CI
on:
  push:
    branches:
      - main
      - vercel_deploy
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --loglevel=error
      - run: npm run build
