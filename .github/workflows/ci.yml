name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

on:
  pull_request:

jobs:
  pr-ci:
    name: PR CI - lint / test (no secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies (opsvantage-web only)
        run: npm ci --prefix opsvantage-web
        name: CI
        on:
          push:
            branches:
              - vercel_deploy
        jobs:
          build:
            runs-on: ubuntu-latest
            steps:
              - name: Checkout repository
                uses: actions/checkout@v4
              - name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                  node-version: '20.x'
                  cache: 'npm'
              - name: Install dependencies
                run: npm install --legacy-peer-deps
              - name: Lint
                run: npm run lint
              - name: Build
                run: npm run build
              - name: Test
                run: npm test
