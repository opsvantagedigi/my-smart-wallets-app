name: CI Push
on:
  push:
    branches:
      - vercel_deploy

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Run lint
        run: npm run lint --if-present

      - name: Run typecheck
        run: npm run typecheck --if-present

      - name: Build Next.js app
        run: npm run build

      # Deployment handled by Vercel integration; omit CLI deploy to avoid editor warnings
